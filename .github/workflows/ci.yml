name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m data.generator
      - name: Train XGBoost
        run: python -c "from app.ml.train import ModelTrainer; ModelTrainer('xgboost').train('data/synthetic/transactions.csv')"
      - name: Train CatBoost
        run: python -c "from app.ml.train import ModelTrainer; ModelTrainer('catboost').train('data/synthetic/transactions.csv')"
      - run: python -m pytest tests/ -v --tb=short
